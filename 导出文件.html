<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>CSV导出示例</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    button {
      background: #0078d4;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #005a9e;
    }

    pre {
      background: #f4f4f4;
      padding: 15px;
      margin-top: 20px;
      border-radius: 5px;
      overflow-x: auto;
    }
  </style>
</head>

<body>
  <h2>智能仓储系统 - CSV导出演示</h2>
  <button id="exportBtn">📥 下载 CSV 文件</button>

  <h3>数据预览：</h3>
  <pre id="preview"></pre>

  <script>
    // 你的数据
    const data = [
      ['姓名', '年龄', '性别'],
      ['张三', '18', '男'],
      ['李四', '20', '女'],
      ['王五', '22', '男']
    ];

    // 显示数据预览
    const previewElement = document.getElementById('preview');
    previewElement.innerHTML = data.map(row => row.join(' | ')).join('\n');

    // 用 addEventListener 绑定按钮（和你导入代码一样的风格）
    document.getElementById('exportBtn').addEventListener('click', () => {
      const csv = data.map(row => row.join(',')).join('\n');
      console.log(data);
      console.log(csv);
      
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = 网站.createObjectURL(blob);
      link.download = 'data.csv';
      link.click();
      网站.revokeObjectURL(link.href);
      console.log('导出成功！');
    });

  </script>
</body>

</html>
